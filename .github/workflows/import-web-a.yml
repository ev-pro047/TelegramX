name: Import upstream Telegram Web A
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/import-web-a.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import and verify exact upstream tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 https://github.com/Ajaxy/telegram-tt.git 4566a14adb6287867f21ed6c51449292581c8653
          git read-tree --reset -u FETCH_HEAD
          git restore --source=HEAD --staged --worktree -- README.md
          git diff --cached --exit-code FETCH_HEAD -- . ':(exclude)README.md'
          git diff --cached --exit-code HEAD -- README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import Telegram Web A at 4566a14, preserve repository README'
          git push origin HEAD:main
