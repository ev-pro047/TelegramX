name: Web XY validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:ts
      - run: npm run check:css
      - name: Compile production bundle (non-account placeholders)
        run: npm run build:production
        env:
          TELEGRAM_API_ID: '1'
          TELEGRAM_API_HASH: '00000000000000000000000000000000'
          BASE_URL: 'https://example.invalid/'
