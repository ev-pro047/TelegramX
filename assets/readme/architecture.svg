<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc">
<title id="title">Web XY and Xydrive architecture</title><desc id="desc">One authenticated browser client uses Telegram messaging and native transfers. Xydrive maps Saved Messages and owned private channels into a logical hierarchy, with optional private-channel metadata synchronization.</desc>
<rect width="1100" height="530" rx="24" fill="#101e2e"/><g font-family="system-ui,-apple-system,Segoe UI,sans-serif" text-anchor="middle">
<text x="550" y="41" font-size="16" letter-spacing="2" fill="#a8c7e4">SIMPLIFIED ARCHITECTURE</text>
<rect x="346" y="63" width="408" height="70" rx="14" fill="#217bc2"/><text x="550" y="92" font-size="23" font-weight="700" fill="#fff">Web XY</text><text x="550" y="116" font-size="15" fill="#e1f0ff">One authenticated browser client</text>
<g fill="none" stroke="#7295b4" stroke-width="2.5" stroke-linejoin="round"><path d="M550 133V154H265V178M550 154H835V178"/><path d="M265 253V281H550V305M835 253V281H550"/><path d="M550 379V398H213V420M550 398V420M550 398H887V420"/></g>
<g fill="#1c3751" stroke="#507799" stroke-width="1.3"><rect x="90" y="178" width="350" height="75" rx="12"/><rect x="660" y="178" width="350" height="75" rx="12"/><rect x="78" y="420" width="270" height="78" rx="12"/><rect x="415" y="420" width="270" height="78" rx="12"/><rect x="752" y="420" width="270" height="78" rx="12"/></g>
<g fill="#f1f7ff" font-size="19" font-weight="600"><text x="265" y="209">Messaging</text><text x="835" y="209">Xydrive</text><text x="213" y="450">Saved Messages</text><text x="550" y="450">Private channels</text><text x="887" y="450">Metadata registry</text></g>
<g fill="#b2cbe2" font-size="14"><text x="265" y="232">Chats and media</text><text x="835" y="232">Logical folders and file index</text><text x="213" y="474">Drive root</text><text x="550" y="474">Owned folder storage</text><text x="887" y="474">Optional experimental sync</text></g>
<rect x="281" y="305" width="538" height="74" rx="14" fill="#217bc2"/><text x="550" y="335" font-size="21" font-weight="700" fill="#fff">Telegram API and native transfer engine</text><text x="550" y="360" font-size="15" fill="#e1f0ff">No separate file-storage server</text></g></svg>
